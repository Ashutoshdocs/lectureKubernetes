# STAGING overlay — prod-like, but smaller.
# Teaches: nameSuffix, image newName (registry mirror), opt-in components.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml

# Components = reusable features. Staging gets autoscaling only.
components:
  - ../../components/hpa

namespace: student-staging
namePrefix: stg-
nameSuffix: -v2          # student-app -> stg-student-app-v2

labels:
  - pairs:
      environment: staging
    includeSelectors: false
    includeTemplates: true

# Pull from a different registry (e.g. an internal mirror) without touching the base.
images:
  - name: nginx
    newName: public.ecr.aws/nginx/nginx
    newTag: 1.27-alpine

configMapGenerator:
  - name: student-config
    behavior: merge
    literals:
      - APP_ENV=staging
  - name: student-html
    behavior: replace
    files:
      - index.html=html/index.html

secretGenerator:
  - name: student-secret
    behavior: replace
    literals:
      - DB_USER=stg_user
      - DB_PASSWORD=stg_password

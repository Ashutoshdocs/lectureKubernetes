# Strategic merge patch.
# Use the BASE name (student-app). Kustomize applies patches before
# namePrefix, so "prod-student-app" here would NOT match.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-app
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      containers:
        - name: nginx          # containers are merged by name
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

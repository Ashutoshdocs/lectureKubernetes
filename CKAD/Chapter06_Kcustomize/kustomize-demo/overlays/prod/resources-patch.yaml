# Strategic-merge patch. `name` is the BASE name; Kustomize matches it
# before the prod- prefix is applied. Only the fields listed here change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-app
spec:
  template:
    spec:
      containers:
        - name: nginx
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }

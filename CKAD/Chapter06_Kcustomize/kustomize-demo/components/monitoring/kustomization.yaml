# A component can also carry patches, not just new resources.
# This one adds Prometheus scrape annotations to the pod template.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Deployment
      name: student-app
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: student-app
      spec:
        template:
          metadata:
            annotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "80"
              prometheus.io/path: "/metrics"

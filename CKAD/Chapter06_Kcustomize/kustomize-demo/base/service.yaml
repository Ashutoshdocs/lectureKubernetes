# BASE Service — NodePort 30080.
# Each overlay patches nodePort so base, dev and prod can run side by side:
#   base -> 30080   dev -> 30081   prod -> 30082
apiVersion: v1
kind: Service
metadata:
  name: student-service
spec:
  type: NodePort
  selector:
    app: student
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080

# PV Access Modes lab (namespace: access-lab)
#
#  A) managed-csi   + ReadWriteOnce     -> 2 pods on 2 DIFFERENT nodes  -> 2nd pod stuck (Multi-Attach error)
#  B) managed-csi   + ReadWriteOncePod  -> 2 pods, any node             -> 2nd pod Pending
#  C) azurefile-csi + ReadWriteMany     -> 2 pods on 2 different nodes  -> both Running, share one file
#  D) managed-csi   + ReadWriteMany     -> Azure Disk can't do RWX filesystem -> PVC never provisions
#
# Apply all at once: kubectl apply -f k8s/30-access-modes-lab.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: access-lab
---
# ---------- A) RWO: one NODE at a time ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: disk-rwo
  namespace: access-lab
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rwo-test
  namespace: access-lab
spec:
  replicas: 2
  selector:
    matchLabels: {app: rwo-test}
  template:
    metadata:
      labels: {app: rwo-test}
    spec:
      affinity:
        podAntiAffinity:            # force the 2 pods onto different nodes
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app: rwo-test}
      containers:
        - name: c
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"$(date +%T) $HOSTNAME\" >> /data/log.txt; sleep 5; done"]
          volumeMounts: [{name: v, mountPath: /data}]
      volumes:
        - name: v
          persistentVolumeClaim: {claimName: disk-rwo}
---
# ---------- B) RWOP: one POD at a time (even on the same node) ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: disk-rwop
  namespace: access-lab
spec:
  accessModes: ["ReadWriteOncePod"]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rwop-test
  namespace: access-lab
spec:
  replicas: 2
  selector:
    matchLabels: {app: rwop-test}
  template:
    metadata:
      labels: {app: rwop-test}
    spec:
      containers:
        - name: c
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"$(date +%T) $HOSTNAME\" >> /data/log.txt; sleep 5; done"]
          volumeMounts: [{name: v, mountPath: /data}]
      volumes:
        - name: v
          persistentVolumeClaim: {claimName: disk-rwop}
---
# ---------- C) RWX: many pods, many nodes ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: files-rwx
  namespace: access-lab
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: azurefile-csi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rwx-test
  namespace: access-lab
spec:
  replicas: 2
  selector:
    matchLabels: {app: rwx-test}
  template:
    metadata:
      labels: {app: rwx-test}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app: rwx-test}
      containers:
        - name: c
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"$(date +%T) $HOSTNAME on $NODE\" >> /data/log.txt; sleep 5; done"]
          env:
            - name: NODE
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          volumeMounts: [{name: v, mountPath: /data}]
      volumes:
        - name: v
          persistentVolumeClaim: {claimName: files-rwx}
---
# ---------- D) Wrong combination: RWX on Azure Disk ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: disk-rwx-wrong
  namespace: access-lab
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 1Gi
---
# managed-csi uses WaitForFirstConsumer, so a pod is needed to trigger provisioning.
apiVersion: v1
kind: Pod
metadata:
  name: disk-rwx-consumer
  namespace: access-lab
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts: [{name: v, mountPath: /data}]
  volumes:
    - name: v
      persistentVolumeClaim: {claimName: disk-rwx-wrong}

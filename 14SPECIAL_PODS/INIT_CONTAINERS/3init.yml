apiVersion: v1
kind: Pod
metadata:
  name: nginx-python-init-demo
  labels:
    app: web-demo
spec:
  # ---------------------------------
  # Step 1: Init Containers
  # ---------------------------------
  initContainers:
  - name: init-download-config
    image: busybox
    command:
      - sh
      - -c
      - |
        echo "Downloading configuration file..."
        mkdir -p /app/config
        echo "APP_ENV=production" > /app/config/app.env
        echo "Config file ready!"
        sleep 2
    volumeMounts:
      - name: app-storage
        mountPath: /app

  - name: init-db-setup
    image: busybox
    command:
      - sh
      - -c
      - |
        echo "Checking DB connection..."
        # Simulated DB ping
        sleep 2
        echo "DB connection successful!" > /app/config/db_status.txt
    volumeMounts:
      - name: app-storage
        mountPath: /app

  - name: init-verify-dependencies
    image: python:3.10-slim
    command:
      - sh
      - -c
      - |
        echo "Verifying dependencies..."
        pip install flask > /dev/null
        echo "Dependencies verified!" > /app/config/deps.txt
    volumeMounts:
      - name: app-storage
        mountPath: /app

  # ---------------------------------
  # Step 2: Main Containers
  # ---------------------------------
  containers:
  - name: nginx
    image: nginx:latest
    ports:
      - containerPort: 80
    volumeMounts:
      - name: app-storage
        mountPath: /usr/share/nginx/html
    command:
      - sh
      - -c
      - |
        echo "<h1>Welcome to Nginx Frontend</h1>" > /usr/share/nginx/html/index.html
        echo "<p>Served by Nginx container.</p>" >> /usr/share/nginx/html/index.html
        nginx -g 'daemon off;'

  - name: python-app
    image: python:3.10-slim
    ports:
      - containerPort: 5000
    volumeMounts:
      - name: app-storage
        mountPath: /app
    command:
      - sh
      - -c
      - |
        pip install flask > /dev/null
        cat <<EOF > /app/app.py
        from flask import Flask
        app = Flask(__name__)
        @app.route('/')
        def home():
            return "Hello from Flask App! Configs: " + open('/app/config/app.env').read()
        if __name__ == '__main__':
            app.run(host='0.0.0.0', port=5000)
        EOF
        python /app/app.py

  # ---------------------------------
  # Step 3: Shared Volume
  # ---------------------------------
  volumes:
  - name: app-storage
    emptyDir: {}


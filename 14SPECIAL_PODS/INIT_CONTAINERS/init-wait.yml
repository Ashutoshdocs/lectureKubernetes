apiVersion: v1
kind: Pod
metadata:
  name: app-with-init
spec:
  initContainers:
  - name: wait-for-mysql
    image: busybox
    command: ['sh', '-c', 'until nc -z mysql 3306; do echo "Waiting for MySQL..."; sleep 2; done; echo "MySQL is ready!"']
  containers:
  - name: main-app
    image: busybox
    command: ['sh', '-c', 'echo "Connected to MySQL and starting app..."; sleep 3600']


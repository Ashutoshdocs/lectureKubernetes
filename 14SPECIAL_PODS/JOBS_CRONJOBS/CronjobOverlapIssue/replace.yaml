apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-replace
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Replace

  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never

          containers:
          - name: demo
            image: busybox
            command:
            - sh
            - -c
            - |
              echo "Started: $(date)"
              sleep 120
              echo "Finished: $(date)"
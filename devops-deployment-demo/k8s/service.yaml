# A Service gives the pods one stable virtual IP + DNS name and load-balances
# across all pods matching the selector. NodePort exposes it outside the cluster
# on a fixed port (good for local demos). Use LoadBalancer on a cloud provider.
apiVersion: v1
kind: Service
metadata:
  name: devops-demo
  labels:
    app: devops-demo
spec:
  type: NodePort
  selector:
    app: devops-demo        # routes to every pod with this label
  ports:
    - port: 80              # port inside the cluster
      targetPort: 8080      # container port
      nodePort: 30080       # external port on the node (30000-32767)

# OPTIONAL: nicer access via a hostname instead of a NodePort.
# Requires an ingress controller (e.g. `minikube addons enable ingress`).
# Then add "127.0.0.1 devops-demo.local" to /etc/hosts (minikube: use `minikube ip`).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-demo
  labels:
    app: devops-demo
spec:
  rules:
    - host: devops-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-demo
                port:
                  number: 80

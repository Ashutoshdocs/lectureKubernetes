# A Deployment keeps N identical pods running and self-heals if any die.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-demo
  labels:
    app: devops-demo
spec:
  replicas: 3                 # run 3 copies -> Service load-balances between them
  selector:
    matchLabels:
      app: devops-demo
  template:
    metadata:
      labels:
        app: devops-demo
    spec:
      containers:
        - name: web
          image: devops-demo:1.0.0
          # For a local cluster (minikube/kind) that has the image loaded,
          # use IfNotPresent so it doesn't try to pull from a registry.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Load all key/values from the ConfigMap as environment variables
          envFrom:
            - configMapRef:
                name: devops-demo-config
          # Probes: k8s restarts unhealthy pods and only sends traffic to ready ones
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          # Resource requests/limits help the scheduler pack pods sanely
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

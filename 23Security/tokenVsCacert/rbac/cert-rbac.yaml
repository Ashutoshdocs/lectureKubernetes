# RBAC for Demo 2 (certificate-based user).
# The cert's Subject O=demo-readers becomes a Kubernetes GROUP.
# We bind to the GROUP, not to a named user — so any cert signed with
# O=demo-readers automatically inherits this access. This is the idiomatic
# pattern for cert auth: manage access by group, issue certs per person.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: auth-demo
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-readers-pod-reader
  namespace: auth-demo
subjects:
# Note the subject KIND: for certs we bind to a Group (from the cert's O field).
# You could also bind kind: User name: cert-user (from the CN) for a single person.
- kind: Group
  name: demo-readers
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io

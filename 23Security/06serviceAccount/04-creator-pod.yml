# The "powerful" pod. It runs as the pod-creator ServiceAccount, so its
# in-cluster kubectl inherits the create/get/list/watch permissions on pods.
apiVersion: v1
kind: Pod
metadata:
  name: creator
  namespace: practical
  labels:
    demo: rbac-serviceaccount
    access: has-permissions
spec:
  serviceAccountName: pod-creator     # <-- this is what gives the pod its powers
  containers:
    - name: kubectl
      image: bitnami/kubectl
      command: ["sleep", "3600"]      # just stay alive so we can exec into it

# A Role is a namespaced set of permissions (what can be done to what).
# This one lets the holder create/read pods -- but deliberately NOT delete them,
# which we use later to show that RBAC is allow-list only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-role
  namespace: practical
  labels:
    demo: rbac-serviceaccount
rules:
  - apiGroups: [""]                              # "" is the core API group, where Pods live
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch"]   # note: no "delete", no "update"

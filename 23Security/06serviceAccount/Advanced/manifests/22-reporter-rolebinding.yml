# Grants the "reporter" Role to the "reporter" ServiceAccount, in this namespace
# only. Role + RoleBinding are namespaced; use ClusterRole/ClusterRoleBinding
# only when a workload genuinely needs cluster-wide reach.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reporter
  namespace: acme-prod
  labels:
    app.kubernetes.io/name: reporter
    app.kubernetes.io/part-of: serviceaccount-demo
subjects:
  - kind: ServiceAccount
    name: reporter
    namespace: acme-prod
roleRef:
  kind: Role
  name: reporter
  apiGroup: rbac.authorization.k8s.io

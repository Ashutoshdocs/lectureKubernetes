# Identity for the front-end app.
#
# This workload never talks to the Kubernetes API, so it should not be handed a
# credential at all. Setting automountServiceAccountToken: false here means NO
# pod using this ServiceAccount gets an API token mounted -- the safest default
# for the majority of application workloads.
#
# Principle: a token that isn't mounted can't be stolen.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-app
  namespace: acme-prod
  labels:
    app.kubernetes.io/name: web-app
    app.kubernetes.io/part-of: serviceaccount-demo
automountServiceAccountToken: false

# Dedicated namespace for the demo.
#
# The pod-security.kubernetes.io labels turn on Pod Security Admission (PSA) in
# "restricted" mode for this namespace. Any pod that isn't hardened (runs as
# root, keeps Linux capabilities, allows privilege escalation, etc.) will be
# REJECTED at admission time. This is a production-grade default and it forces
# every workload below to declare a proper securityContext.
apiVersion: v1
kind: Namespace
metadata:
  name: acme-prod
  labels:
    app.kubernetes.io/part-of: serviceaccount-demo
    # enforce = block non-compliant pods; warn/audit = log only.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted

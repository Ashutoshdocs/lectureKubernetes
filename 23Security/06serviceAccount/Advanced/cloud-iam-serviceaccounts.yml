# =============================================================================
# REFERENCE ONLY -- do NOT `kubectl apply` this file on a local cluster.
#
# In production on managed Kubernetes you almost never store cloud credentials
# inside the cluster. Instead you map a Kubernetes ServiceAccount to a cloud
# identity, and pods get short-lived cloud tokens automatically.
#
# Below are the three common patterns. Each needs matching setup on the cloud
# side (an IAM role / managed identity plus a trust relationship), so they will
# not work by themselves -- they show the Kubernetes-side annotation only.
# =============================================================================

# -----------------------------------------------------------------------------
# AWS EKS -- IRSA (IAM Roles for Service Accounts)
# Prereq: an OIDC provider on the cluster + an IAM role whose trust policy
# allows this ServiceAccount.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-reader
  namespace: acme-prod
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::111122223333:role/acme-prod-s3-reader"
---
# -----------------------------------------------------------------------------
# Google GKE -- Workload Identity
# Prereq: Workload Identity enabled + an IAM policy binding linking this KSA to
# a Google service account.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcs-reader
  namespace: acme-prod
  annotations:
    iam.gke.io/gcp-service-account: "gcs-reader@my-project.iam.gserviceaccount.com"
---
# -----------------------------------------------------------------------------
# Azure AKS -- Workload Identity
# Prereq: an OIDC issuer + a user-assigned managed identity with a federated
# credential trusting this ServiceAccount. The pod template also needs the
# label  azure.workload.identity/use: "true".
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blob-reader
  namespace: acme-prod
  annotations:
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"

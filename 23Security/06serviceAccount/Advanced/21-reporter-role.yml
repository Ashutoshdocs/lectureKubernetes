# Least-privilege permissions for the reporter.
#
# Two teaching points live here:
#   1. Read-only verbs only (get/list/watch) -- no create/update/delete.
#   2. resourceNames locks configmap access to ONE named object. The reporter
#      can read "app-config" and nothing else, not even other configmaps in the
#      same namespace.
#
# Gotcha worth knowing: resourceNames works with verbs that address a single
# object (get, update, patch, delete) but NOT with "list" or "watch" (you can't
# list a subset of objects by name via RBAC). That's why configmaps below only
# grant "get" -- the reporter fetches app-config by name, it never lists.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reporter
  namespace: acme-prod
  labels:
    app.kubernetes.io/name: reporter
    app.kubernetes.io/part-of: serviceaccount-demo
rules:
  # Read-only visibility into pods in this namespace.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # Read exactly one ConfigMap, by name. Nothing else.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["app-config"]
    verbs: ["get"]

  # Deliberately NOT granted: secrets, other configmaps, create/delete/update.

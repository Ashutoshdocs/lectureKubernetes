# Identity for the "reporter" workload -- a small controller-style pod that DOES
# need to read from the Kubernetes API (it lists pods and reads one ConfigMap).
#
# We disable the legacy auto-mount here because the Deployment mounts a
# purpose-built, short-lived, audience-scoped token itself (see 25-*.yml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reporter
  namespace: acme-prod
  labels:
    app.kubernetes.io/name: reporter
    app.kubernetes.io/part-of: serviceaccount-demo
automountServiceAccountToken: false

# -----------------------------------------------------------------------------
# Source MySQL database: credentials, an init table, the pod, and a NodePort svc.
# This is the DB the frontend writes into and the backup Job dumps from.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: mysql-cred
  namespace: sa-demo
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "RootPass123!"
  MYSQL_DATABASE: "appdb"
  MYSQL_USER: "appuser"
  MYSQL_PASSWORD: "AppPass123!"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: sa-demo
data:
  # Runs automatically on first start (docker-entrypoint-initdb.d).
  init.sql: |
    USE appdb;
    CREATE TABLE IF NOT EXISTS messages (
      id INT AUTO_INCREMENT PRIMARY KEY,
      content VARCHAR(255) NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    INSERT INTO messages (content) VALUES ('seed row from init.sql');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: sa-demo
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-cred
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 20
            periodSeconds: 5
      volumes:
        - name: init
          configMap:
            name: mysql-init
        - name: data
          emptyDir: {}   # demo only — data is lost if the pod is deleted
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: sa-demo
spec:
  type: NodePort
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      nodePort: 30306

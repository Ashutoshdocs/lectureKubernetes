# -----------------------------------------------------------------------------
# Azure Storage credential. We store a CONTAINER-LEVEL SAS URL, so the backup
# Job can upload with plain `curl` (no azure-cli needed).
#
# This Secret is the thing the backup Job reads *through the Kubernetes API*,
# which is what the ServiceAccount + RBAC actually gates. See README section 6-8.
#
# How to get a SAS URL:
#   1. az storage container create --account-name <acct> --name backups --auth-mode login
#   2. az storage container generate-sas \
#        --account-name <acct> --name backups \
#        --permissions rwlac --expiry 2026-12-31 --https-only -o tsv
#   3. SAS_URL = https://<acct>.blob.core.windows.net/backups?<the-sas-token-from-step-2>
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: azure-storage-cred
  namespace: sa-demo
type: Opaque
stringData:
  # Replace the whole value with your real container SAS URL.
  SAS_URL: "https://REPLACEME.blob.core.windows.net/backups?sv=2024-11-04&ss=b&srt=co&sp=rwlac&se=2026-12-31T00:00:00Z&sig=REPLACE_SIGNATURE"

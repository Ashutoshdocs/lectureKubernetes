#-----------------------------------------------------------------------------
# haproxy.cfg  -- the heart of this lab
#
# HAProxy is the SINGLE entry point. Users never touch an API server directly.
#
#   Manohar's kubeconfig -> https://<HAPROXY_IP>:7001  -> API server 1 (cluster1-cp)
#   Ashutosh's kubeconfig -> https://<HAPROXY_IP>:7002 -> API server 2 (cluster2-cp)
#
# This is TCP (layer 4) pass-through: HAProxy does NOT terminate TLS, it just
# forwards the raw 6443 traffic, so kubectl's client certs reach the API server
# unchanged. That is why RBAC / authentication still works end to end.
#
# >>> REPLACE __C1CP_IP__ and __C2CP_IP__ with the PRIVATE IPs of the two
# >>> control-plane VMs before installing (03-haproxy.sh does this for you).
#-----------------------------------------------------------------------------

global
    log /dev/log local0
    maxconn 2000
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 10s
    timeout client  30m
    timeout server  30m

#--- Cluster 1 = Manohar ------------------------------------------------------
frontend cluster1_api
    bind *:7001
    mode tcp
    default_backend cluster1_backend

backend cluster1_backend
    mode tcp
    option tcp-check
    # "server1 or server2" style pool. Add cluster1's 2nd API server here for HA.
    server apiserver1 __C1CP_IP__:6443 check

#--- Cluster 2 = Ashutosh -----------------------------------------------------
frontend cluster2_api
    bind *:7002
    mode tcp
    default_backend cluster2_backend

backend cluster2_backend
    mode tcp
    option tcp-check
    server apiserver2 __C2CP_IP__:6443 check

#--- Stats dashboard (http://<HAPROXY_IP>:8404/stats) -------------------------
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats admin if TRUE

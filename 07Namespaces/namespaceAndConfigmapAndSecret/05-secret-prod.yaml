# =============================================================================
# PROD Secret - immutable, keyed for FILE mounting
# -----------------------------------------------------------------------------
# In prod we'll mount these as files rather than inject them as env vars (see the
# deployment for why that's safer). Because the keys become FILENAMES, they can
# use hyphens - they don't need to be valid env-var names here.
#
# immutable: true applies to Secrets too. To rotate a password you create a NEW
# Secret (or delete+recreate) and roll the Deployment - which is exactly the
# discipline you want around credentials.
#
#   kubectl apply -f 05-secret-prod.yaml
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: prod
type: Opaque
immutable: true
stringData:
  root-password: prodpassword
  app-password: produserpass

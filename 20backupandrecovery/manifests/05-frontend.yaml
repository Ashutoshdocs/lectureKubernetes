apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: arcade
  labels: { app: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: arcade-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: arcade
spec:
  type: NodePort             # THIS is the NodePort that exposes the app
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080        # reachable at http://<NODE_IP>:30080

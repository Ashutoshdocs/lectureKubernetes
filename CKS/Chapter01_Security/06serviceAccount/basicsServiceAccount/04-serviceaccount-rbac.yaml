# -----------------------------------------------------------------------------
# The star of the demo.
#
#   ServiceAccount = the identity the Job's pod presents to the Kubernetes API.
#   Role           = a list of allowed actions (here: GET one specific Secret).
#   RoleBinding    = attaches the Role to the ServiceAccount.
#
# The default ServiceAccount has NO Role, so it cannot read the Secret via the
# API. backup-sa can — but ONLY the one Secret named below (least privilege).
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-sa
  namespace: sa-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-storage-secret
  namespace: sa-demo
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["azure-storage-cred"]   # scoped to just this one secret
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-sa-can-read-storage-secret
  namespace: sa-demo
subjects:
  - kind: ServiceAccount
    name: backup-sa
    namespace: sa-demo
roleRef:
  kind: Role
  name: read-storage-secret
  apiGroup: rbac.authorization.k8s.io

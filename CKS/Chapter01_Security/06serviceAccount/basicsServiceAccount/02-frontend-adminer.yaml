# -----------------------------------------------------------------------------
# Frontend: Adminer is a single-file DB UI. Users open it in a browser and
# insert rows into MySQL. Exposed via NodePort so you can reach it from outside.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: sa-demo
  labels:
    app: adminer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
        - name: adminer
          image: adminer:4
          ports:
            - containerPort: 8080
          env:
            # Pre-fills the "Server" field with the MySQL Service name.
            - name: ADMINER_DEFAULT_SERVER
              value: "mysql"
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: sa-demo
spec:
  type: NodePort
  selector:
    app: adminer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30808

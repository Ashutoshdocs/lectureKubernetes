# ============================================================================
# 00 - THE PROBLEM (DO NOT USE IN PRODUCTION)
# ============================================================================
# The frontend also carries the SQL password in plain text as an env var.
# Same problems as the SQL deployment: leaked in YAML, on the node, in Git.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    demo-stage: "00-insecure"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: SQL_HOST
              value: "sql"
            - name: SQL_USER
              value: "sa"
            # ---------------------------------------------------------------
            # !!! THE VULNERABILITY !!!  Plain-text password again.
            # ---------------------------------------------------------------
            - name: SQL_PASSWORD
              value: "P@ssw0rd-VERY-INSECURE-123"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80

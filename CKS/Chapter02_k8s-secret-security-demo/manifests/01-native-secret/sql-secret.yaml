# ============================================================================
# 01 - NATIVE KUBERNETES SECRET
# ============================================================================
# The password is moved OUT of the Deployment into a Secret object, and the
# Deployment references it with secretKeyRef. The password no longer sits in
# the Deployment YAML.
#
# IMPORTANT NUANCE:
#   * `data:` values are base64-ENCODED, NOT encrypted. Anyone with
#     `kubectl get secret sql-secret -o yaml` + `base64 -d` sees the value.
#   * By default Secrets are stored UNENCRYPTED in etcd (see stage 03).
#   * >>> You should still NOT commit this file to Git <<< because base64 is
#     trivially reversible. Better: create the Secret imperatively (see below)
#     so the value never touches a file.
#
# RECOMMENDED (do NOT store this file in Git):
#   kubectl create secret generic sql-secret \
#     --from-literal=MSSQL_SA_PASSWORD='P@ssw0rd-VERY-INSECURE-123'
#
# `stringData` lets you write the raw value (Kubernetes base64-encodes it for
# you). It is shown here for clarity only.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: sql-secret
  labels:
    demo-stage: "01-native-secret"
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: "P@ssw0rd-VERY-INSECURE-123"

# ============================================================================
# 04 - AZURE KEY VAULT (via Secrets Store CSI Driver)  --  RECOMMENDED
# ============================================================================
# The password lives in Azure Key Vault, OUTSIDE the cluster. It is NEVER in
# any YAML, never in Git, never in etcd. The Secrets Store CSI Driver fetches
# it at pod-start time using the pod's Azure Workload Identity.
#
# The `secretObjects` block also mirrors the fetched value into a normal
# Kubernetes Secret (`sql-secret`) so the Deployments can inject it as an env
# var with secretKeyRef -- exactly like earlier stages.
#
# Fill in the four <PLACEHOLDER> values. Full setup is in the README.
# ============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-sql-kv
  namespace: default
  labels:
    demo-stage: "04-azure-key-vault"
spec:
  provider: azure
  # ---- Sync the Key Vault value into a k8s Secret for env-var use ----
  secretObjects:
    - secretName: sql-secret          # the Secret that gets created
      type: Opaque
      data:
        - objectName: sql-password    # must match objects[].objectName below
          key: MSSQL_SA_PASSWORD      # key inside the created Secret
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<AZURE_WORKLOAD_IDENTITY_CLIENT_ID>"   # user-assigned identity
    keyvaultName: "<YOUR_KEYVAULT_NAME>"
    tenantId: "<YOUR_AZURE_TENANT_ID>"
    objects: |
      array:
        - |
          objectName: sql-password    # the SECRET NAME inside Key Vault
          objectType: secret
          objectVersion: ""           # empty = latest version

# ============================================================================
# 02 - SEALED SECRETS (Bitnami)  --  SAFE TO COMMIT TO GITHUB
# ============================================================================
# A SealedSecret is a Secret encrypted with the cluster controller's PUBLIC
# key. Only the sealed-secrets controller running IN the cluster holds the
# matching private key, so only it can decrypt. That means:
#
#   * You CAN safely commit this file to a public GitHub repo.
#   * The controller decrypts it into a normal Secret named `sql-secret`,
#     which your Deployments consume exactly as in stage 01.
#
# HOW THIS FILE WAS GENERATED (do not hand-edit the encryptedData):
#
#   # 1. Install the controller (once per cluster):
#   helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
#   helm install sealed-secrets sealed-secrets/sealed-secrets -n kube-system
#
#   # 2. Create a normal secret locally (never committed) and seal it:
#   kubectl create secret generic sql-secret \
#     --from-literal=MSSQL_SA_PASSWORD='P@ssw0rd-VERY-INSECURE-123' \
#     --dry-run=client -o yaml \
#   | kubeseal --controller-namespace kube-system --format yaml \
#     > sql-sealedsecret.yaml
#
# The `encryptedData` below is a PLACEHOLDER. Run the command above against
# YOUR cluster to produce real ciphertext (it is cluster-specific).
# ============================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sql-secret
  namespace: default
  labels:
    demo-stage: "02-sealed-secrets"
spec:
  encryptedData:
    # <<< PLACEHOLDER >>> replace with the output of `kubeseal`.
    MSSQL_SA_PASSWORD: AgByREPLACE_ME_WITH_REAL_SEALED_CIPHERTEXT_FROM_kubeseal==
  template:
    metadata:
      name: sql-secret
      namespace: default
    type: Opaque

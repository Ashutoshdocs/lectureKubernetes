# ============================================================================
# 04 - AZURE KEY VAULT  --  frontend deployment
# ============================================================================
# The frontend also mounts the SecretProviderClass and reads the synced
# Secret. Same pattern as the SQL pod. No secret value in this file.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    demo-stage: "04-azure-key-vault"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: workload-identity-sa
      containers:
        - name: frontend
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: SQL_HOST
              value: "sql"
            - name: SQL_USER
              value: "sa"
            # ---- Password from the CSI-synced Secret ----
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sql-secret
                  key: MSSQL_SA_PASSWORD
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: azure-sql-kv
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80

apiVersion: apps/v1
kind: Deployment

metadata:
  name: greenpulse
  labels:
    app: greenpulse

spec:
  replicas: 3

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: greenpulse

  template:
    metadata:
      labels:
        app: greenpulse

    spec:
      containers:
        - name: greenpulse
          image: greenpulse:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: APP_VERSION
              value: "v1"

            - name: DEPLOYMENT_MODEL
              value: "Kubernetes"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hpa
spec:
  replicas: 1

  selector:
    matchLabels:
      app: memory-hpa

  template:
    metadata:
      labels:
        app: memory-hpa

    spec:
      containers:

      - name: memory-app

        image: python:3.12-alpine

        command:
        - python
        - /app/app.py

        ports:
        - containerPort: 8080

        resources:

          requests:
            memory: 64Mi
            cpu: 50m

          limits:
            memory: 256Mi
            cpu: 200m

        volumeMounts:

        - name: application-code
          mountPath: /app

      volumes:

      - name: application-code

        configMap:
          name: memory-app-code

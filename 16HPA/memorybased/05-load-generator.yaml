apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-load-generator
  namespace: hpa-demo
  labels:
    app: memory-load-generator
spec:
  # Dial load up or down at runtime:
  #   kubectl -n hpa-demo scale deploy/memory-load-generator --replicas=3
  # Scale to 0 (or delete) to let memory decay and watch it scale IN.
  replicas: 1
  selector:
    matchLabels:
      app: memory-load-generator
  template:
    metadata:
      labels:
        app: memory-load-generator
    spec:
      containers:
      - name: load-generator
        image: busybox:1.36
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "generating load against memory-hpa-svc..."
          while true; do
            wget -q -O- http://memory-hpa-svc/load >/dev/null 2>&1
            sleep 2
          done

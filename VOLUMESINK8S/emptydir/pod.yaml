apiVersion: v1
kind: Pod

metadata:
  name: nginx-emptydir-pod

  labels:
    app: nginx-emptydir

spec:

  containers:

  - name: nginx
    image: nginx:latest

    ports:
    - containerPort: 80

    volumeMounts:

    - name: nginx-html
      mountPath: /usr/share/nginx/html


  volumes:

  - name: nginx-html
    emptyDir: {}
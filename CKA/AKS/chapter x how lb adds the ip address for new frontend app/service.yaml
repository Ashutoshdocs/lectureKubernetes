apiVersion: v1
kind: Service
metadata:
  name: color-web
  labels:
    app: color-web
spec:
  type: LoadBalancer
  # Explicitly None. If this were ClientIP, every request from one client would
  # be pinned to a single pod - one of the classic "always the same pod" causes.
  sessionAffinity: None
  selector:
    app: color-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

# ============================================================
# 1. CLUSTERIP  -  internal virtual IP (default)
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-clusterip
data:
  nginx.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="10">
    <title>ClusterIP · nginx</title>
    <style>
      :root{
        --accent:#22d3ee;--accent-dim:#0e7490;
        --bg:#0a1626;--panel:#0f2136;--ink:#dbe7f3;--muted:#7c93a8;
        --line:rgba(120,160,200,.14);
      }
      *{box-sizing:border-box}
      html,body{margin:0;height:100%}
      body{
        font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
        background:
          linear-gradient(var(--line) 1px,transparent 1px) 0 0/28px 28px,
          linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/28px 28px,
          radial-gradient(1200px 600px at 80% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),
          var(--bg);
        display:flex;align-items:center;justify-content:center;padding:32px 18px;min-height:100vh;
      }
      .card{width:100%;max-width:720px;background:linear-gradient(180deg,var(--panel),#0b1a2b);
        border:1px solid var(--line);border-radius:18px;
        box-shadow:0 30px 80px -30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.03);overflow:hidden;}
      .top{padding:26px 30px 22px;border-bottom:1px dashed var(--line);position:relative;}
      .top::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
        background:linear-gradient(var(--accent),var(--accent-dim));}
      .eyebrow{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
        font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;}
      h1{margin:0;font-size:clamp(30px,7vw,46px);line-height:1;letter-spacing:-.02em;font-weight:800;color:#fff;}
      h1 .dot{color:var(--accent)}
      .tagline{margin:12px 0 0;color:var(--muted);font-size:15px;max-width:52ch}
      .badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
      .badge{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;padding:6px 11px;
        border-radius:999px;border:1px solid var(--line);color:var(--ink);background:rgba(255,255,255,.02);}
      .badge.served{border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent);
        box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 20%,transparent) inset;}
      .body{padding:24px 30px 8px}
      pre.route{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;line-height:1.5;color:var(--ink);
        background:#081320;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 22px;overflow:auto;}
      pre.route .hl{color:var(--accent);font-weight:700}
      .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
        border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px}
      .cell{background:var(--panel);padding:14px 16px}
      .cell .k{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.12em;
        text-transform:uppercase;color:var(--muted);margin:0 0 6px}
      .cell .v{margin:0;font-size:15px;color:#fff;font-weight:600}
      @media(max-width:520px){.grid{grid-template-columns:1fr}}
      .foot{padding:16px 30px 26px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;
        gap:14px;flex-wrap:wrap;align-items:center;}
      .foot code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px;color:var(--accent);
        background:#081320;border:1px solid var(--line);padding:6px 10px;border-radius:8px;}
      .foot .sig{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--muted)}
      .pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);
        margin-right:7px;vertical-align:middle;animation:p 2s infinite}
      @keyframes p{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}
        70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
      @media(prefers-reduced-motion:reduce){.pulse{animation:none}}
    </style>
    </head>
    <body>
      <main class="card">
        <div class="top">
          <p class="eyebrow">Kubernetes · Service Networking</p>
          <h1>ClusterIP<span class="dot">.</span></h1>
          <p class="tagline">The default service type. Gets a stable virtual IP reachable only from inside the cluster — perfect for internal app-to-app traffic.</p>
          <div class="badges">
            <span class="badge served"><span class="pulse"></span>served by nginx :80</span>
            <span class="badge">pod / pod-clusterip</span>
            <span class="badge">browser view (colour)</span>
          </div>
        </div>
        <div class="body">
          <pre class="route">[ another pod / service ]
              |   cluster-internal VIP
              v
       svc-clusterip  (10.x.x.x)
              |
              v
       <span class="hl">nginx on pod-clusterip</span></pre>
          <div class="grid">
            <div class="cell"><p class="k">Reachable inside cluster</p><p class="v">Yes — via svc-clusterip</p></div>
            <div class="cell"><p class="k">Reachable from outside</p><p class="v">No — cluster-internal only</p></div>
            <div class="cell"><p class="k">nginx endpoint</p><p class="v">port 80 &rarr; http</p></div>
            <div class="cell"><p class="k">python endpoint</p><p class="v">port 8080 &rarr; python</p></div>
          </div>
        </div>
        <div class="foot">
          <code>kubectl exec POD -- curl svc-clusterip</code>
          <span class="sig">curl this URL &rarr; plain box · nginx</span>
        </div>
      </main>
    </body>
    </html>


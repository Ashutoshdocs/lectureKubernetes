      .top{padding:26px 30px 22px;border-bottom:1px dashed var(--line);position:relative;}
      .top::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
        background:linear-gradient(var(--accent),var(--accent-dim));}
      .eyebrow{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
        font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;}
      h1{margin:0;font-size:clamp(30px,7vw,46px);line-height:1;letter-spacing:-.02em;font-weight:800;color:#fff;}
      h1 .dot{color:var(--accent)}

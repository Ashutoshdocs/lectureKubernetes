  nginx.txt: |
    ╔══════════════════════════════════════════════════════════════╗
    ║               KUBERNETES SERVICE  -  CLUSTERIP               ║
    ║                 curl / CLI view (plain text)                 ║
    ╠══════════════════════════════════════════════════════════════╣
    ║                                                              ║
    ║  Service Details                                             ║
    ║  ----------------------------------------------------------  ║
    ║  Service Name    : svc-clusterip                             ║
    ║  Type            : ClusterIP                                 ║
    ║  Served By       : nginx :80                                 ║
    ║  Pod             : pod-clusterip                             ║
    ║                                                              ║
    ║  Traffic Path                                                ║
    ║  ----------------------------------------------------------  ║
    ║    another pod  ->  svc-clusterip (VIP)  ->  pod             ║
    ║                                                              ║
    ║  Reachability                                                ║
    ║  ----------------------------------------------------------  ║
    ║  Inside cluster  : YES                                       ║
    ║  From outside    : NO                                        ║

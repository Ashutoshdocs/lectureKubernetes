  python.txt: |
    ╔══════════════════════════════════════════════════════════════╗
    ║               KUBERNETES SERVICE  -  CLUSTERIP               ║
    ║                 curl / CLI view (plain text)                 ║
    ╠══════════════════════════════════════════════════════════════╣
    ║                                                              ║
    ║  Service Details                                             ║
    ║  ----------------------------------------------------------  ║
    ║  Service Name    : svc-clusterip                             ║
    ║  Type            : ClusterIP                                 ║
    ║  Served By       : python :8080                              ║
    ║  Pod             : pod-clusterip                             ║
    ║                                                              ║
    ║  Traffic Path                                                ║
    ║  ----------------------------------------------------------  ║
    ║    another pod  ->  svc-clusterip (VIP)  ->  pod             ║
    ║                                                              ║
    ║  Reachability                                                ║
    ║  ----------------------------------------------------------  ║
    ║  Inside cluster  : YES                                       ║
    ║  From outside    : NO                                        ║
    ║  Port mapping    : 80->http , 8080->python                   ║
    ║                                                              ║
    ╠══════════════════════════════════════════════════════════════╣
    ║  [OK] Open this URL in a browser for the colour version      ║
    ╚══════════════════════════════════════════════════════════════╝

  nginx.conf: |
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        charset utf-8;

        location = / {
            default_type text/html;
            if ($http_user_agent ~* (curl|wget|libcurl|httpie|python-requests|Go-http|PowerShell|Wget|HTTPie|fetch)) {
                rewrite ^ /dashboard.txt last;
            }
            try_files /index.html =404;
        }

        location = /dashboard.txt {
            default_type text/plain;
        }
    }

  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from pathlib import Path

    BASE = Path("/www")
    HTML = (BASE / "index.html").read_bytes()
    TXT  = (BASE / "dashboard.txt").read_bytes()
    CLI  = ("curl", "wget", "libcurl", "httpie", "python-requests", "go-http", "powershell", "fetch")

    class Handler(BaseHTTPRequestHandler):
        server_version = "k8s-svc-demo"

        def _send(self, body, ctype):
            self.send_response(200)
            self.send_header("Content-Type", ctype + "; charset=utf-8")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/favicon.ico":
                self.send_response(404); self.end_headers(); return
            if self.path.rstrip("/") == "/dashboard.txt":
                return self._send(TXT, "text/plain")
            ua = (self.headers.get("User-Agent") or "").lower()
            if any(tok in ua for tok in CLI):
                self._send(TXT, "text/plain")
            else:
                self._send(HTML, "text/html")

        def log_message(self, *args):
            pass

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()

---
apiVersion: v1
kind: Pod
metadata:
  name: pod-clusterip
  labels:
    app: demo-clusterip
spec:
  volumes:
  - name: web
    configMap:
      name: web-clusterip
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - name: http
      containerPort: 80
    volumeMounts:
    - name: web
      mountPath: /usr/share/nginx/html/index.html
      subPath: nginx.html
    - name: web
      mountPath: /usr/share/nginx/html/dashboard.txt
      subPath: nginx.txt
    - name: web
      mountPath: /etc/nginx/conf.d/default.conf
      subPath: nginx.conf
  - name: python
    image: python:3.9-slim
    workingDir: /www
    command: ["python"]
    args: ["/www/server.py"]
    ports:
    - name: python
      containerPort: 8080
    volumeMounts:
    - name: web
      mountPath: /www/index.html
      subPath: python.html
    - name: web
      mountPath: /www/dashboard.txt
      subPath: python.txt
    - name: web
      mountPath: /www/server.py
      subPath: server.py
---
apiVersion: v1
kind: Service
metadata:
  name: svc-clusterip
spec:
  type: ClusterIP
  selector:
    app: demo-clusterip
  ports:
  - name: nginx-http
    port: 80
    targetPort: http
  - name: python-http
    port: 8080
    targetPort: python
---

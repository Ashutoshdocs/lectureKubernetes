apiVersion: v1
kind: Pod
metadata:
  name: localhost-demo
spec:
  containers:
  - name: c01
    image: nginx:alpine
    command:
      - /bin/sh
      - -c
      - |
        echo "HIT C01" > /usr/share/nginx/html/index.html
        nginx -g 'daemon off;'
    ports:
    - containerPort: 80

  - name: c02
    image: nginx:alpine
    command:
      - /bin/sh
      - -c
      - |
        echo "HIT C02" > /usr/share/nginx/html/index.html
        sed -i 's/listen       80;/listen       8080;/' /etc/nginx/conf.d/default.conf
        nginx -g 'daemon off;'
    ports:
    - containerPort: 8080


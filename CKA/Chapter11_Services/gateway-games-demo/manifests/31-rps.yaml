# ---------------------------------------------------------------------------
# Rock Paper Scissors: Deployment + Service.
# The HTML is mounted from the ConfigMap "rps-html" (21-rps-configmap.yaml).
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rps
  namespace: games
  labels:
    app: rps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rps
  template:
    metadata:
      labels:
        app: rps
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: content
          configMap:
            name: rps-html
---
apiVersion: v1
kind: Service
metadata:
  name: rps
  namespace: games
  labels:
    app: rps
spec:
  selector:
    app: rps
  ports:
    - name: http
      port: 80
      targetPort: 8080

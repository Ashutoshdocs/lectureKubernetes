# ---------------------------------------------------------------------------
# Tic-Tac-Toe: Deployment + Service.
# The HTML is mounted from the ConfigMap "tictactoe-html" (20-tictactoe-configmap.yaml)
# into the nginx default web root. No custom image needed.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tictactoe
  namespace: games
  labels:
    app: tictactoe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tictactoe
  template:
    metadata:
      labels:
        app: tictactoe
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: content
          configMap:
            name: tictactoe-html
---
apiVersion: v1
kind: Service
metadata:
  name: tictactoe
  namespace: games
  labels:
    app: tictactoe
spec:
  selector:
    app: tictactoe
  ports:
    - name: http
      port: 80
      targetPort: 8080

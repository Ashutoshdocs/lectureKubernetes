apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql

spec:
  serviceName: mysql-hl

  replicas: 3

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:
      containers:
      - name: mysql

        image: mysql:5.7

        env:
        - name: MYSQL_ROOT_PASSWORD
          value: Pass@12345

        ports:
        - containerPort: 3306

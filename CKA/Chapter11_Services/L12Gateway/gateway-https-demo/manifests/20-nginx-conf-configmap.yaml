# ---------------------------------------------------------------------------
# Shared nginx server config (port 8080, /whoami, /healthz) for all web Pods.
# Generated from nginx/default.conf by scripts/build-configmaps.sh.
# Edit the source file and re-run the script; don't edit this block by hand.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: webapps
data:
  default.conf: |
    # Shared nginx server config for all three web Pods (home, app1, app2).
    # Mounted over /etc/nginx/conf.d/default.conf in nginx-unprivileged.
    server {
        listen       8080;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Redirects (e.g. /dir -> /dir/) use a relative Location header, so nginx
        # never leaks its internal port 8080 to the browser behind the Gateway.
        absolute_redirect off;

        # Tag every response with the Pod that produced it.
        add_header X-Served-By $hostname always;

        # Returns the Pod name. The pages call this to show which replica served them.
        location = /whoami {
            default_type text/plain;
            add_header X-Served-By $hostname always;
            add_header Cache-Control "no-store" always;
            return 200 "$hostname\n";
        }

        # Lightweight endpoint for readiness and liveness probes.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

# ---------------------------------------------------------------------------
# App 1 (TaskFlow) at akblazeacademy.net/app1 : Deployment + Service.
# HTML comes from ConfigMap "app1-html", nginx config from "nginx-conf".
# The Gateway strips "/app1" before forwarding, so nginx serves it from "/".
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: webapps
  labels:
    app: app1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: content
          configMap:
            name: app1-html
        - name: nginx-conf
          configMap:
            name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: app1
  namespace: webapps
  labels:
    app: app1
spec:
  selector:
    app: app1
  ports:
    - name: http
      port: 80
      targetPort: http

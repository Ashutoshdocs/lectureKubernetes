apiVersion: v1
kind: Pod
metadata:
  name: app-with-init
  labels:
    app: app-with-init
spec:
  # ── INIT CONTAINER ──────────────────────────────────────────
  # Blocks until the MySQL Service answers on port 3306.
  # The main app container will not start until this succeeds.
  initContainers:
  - name: wait-for-mysql
    image: busybox
    command:
    - sh
    - -c
    - |
      echo "[init] Waiting for MySQL to be reachable at mysql:3306..."
      until nc -z mysql 3306; do
        echo "[init] MySQL not up yet - retrying in 2s..."
        sleep 2
      done
      echo "[init] MySQL is ready! Continuing to start the app."

  # ── MAIN CONTAINER ──────────────────────────────────────────
  containers:
  - name: main-app
    image: busybox
    command:
    - sh
    - -c
    - |
      echo "[app] Connected to MySQL and starting app..."
      sleep 3600

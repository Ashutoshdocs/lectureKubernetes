apiVersion: v1
kind: Pod
metadata:
  name: init-script-demo
  labels:
    app: init-script-demo
spec:
  # A scratch volume shared between the init container and the main container.
  volumes:
  - name: shared-data
    emptyDir: {}

  # ── INIT CONTAINER ──────────────────────────────────────────
  # Runs a setup SCRIPT to completion BEFORE the main container starts.
  # The main container won't start until this exits 0.
  initContainers:
  - name: prepare-content
    image: busybox
    command:
    - sh
    - -c
    - |
      echo "[init] Preparing web content..."
      echo "<h1>Welcome from the Init Container</h1>"        >  /data/index.html
      echo "<p>This page was generated by an init script.</p>" >> /data/index.html
      echo "<p>Generated at: $(date)</p>"                    >> /data/index.html
      echo "[init] Simulating some setup work..."
      sleep 5
      echo "[init] Content ready."
    volumeMounts:
    - name: shared-data
      mountPath: /data

  # ── MAIN CONTAINER ──────────────────────────────────────────
  # Serves the file the init container produced.
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 80
    volumeMounts:
    - name: shared-data
      mountPath: /usr/share/nginx/html

apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-rs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-rs
  template:
    metadata:
      labels:
        app: nginx-rs
        version: rsv2
    spec:
      containers:
        - name: nginx
          image: DOCKERHUB_USERNAME/myreplicasetdemo:rsv2
          ports:
            - containerPort: 80

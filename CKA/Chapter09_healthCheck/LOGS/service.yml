apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: logs-demo
spec:
  type: NodePort
  selector:
    app: frontend           # matches the pod's label app=frontend
  ports:
  # Container 1 (nginx) -> nodePort 30080
  - name: nginx
    port: 80
    targetPort: 80
    nodePort: 30080
  # Container 2 (python) -> nodePort 30081
  - name: python
    port: 8080
    targetPort: 8080
    nodePort: 30081

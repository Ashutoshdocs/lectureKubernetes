apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilience-demo
  labels:
    app: resilience-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: resilience-demo
  template:
    metadata:
      labels:
        app: resilience-demo
    spec:
      # Spread pods across nodes so the LB and rescheduling demos are visible.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: resilience-demo
      containers:
        - name: web
          # 👉 Replace with your image (see README: Build & push).
          image: your-registry/k8s-resilience-demo:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Container name is not exposed by the Downward API, so set it plainly.
            - name: CONTAINER_NAME
              value: web
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              # Small on purpose: two "Leak 40 MB" clicks blow past this → OOMKilled.
              cpu: 250m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

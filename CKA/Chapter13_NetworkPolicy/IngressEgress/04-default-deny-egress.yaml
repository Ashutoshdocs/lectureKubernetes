# STAGE 3 - Lock the back door too.
# Every pod in "shop" may no longer open ANY outgoing connection:
# not to other pods, not to the internet, and NOT EVEN TO DNS.
# Expect almost everything to break - that is the lesson.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: shop
spec:
  podSelector: {}
  policyTypes: ["Egress"]

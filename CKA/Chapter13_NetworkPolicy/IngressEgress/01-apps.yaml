# ---------------- outsider client ----------------
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: outsider
  labels:
    app: client
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "while true; do sleep 3600; done"]

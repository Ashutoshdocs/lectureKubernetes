# Three nginx tiers in "shop" + one client pod in "outsider".
# Every nginx answers:
#   You successfully hit <podname> under <namespace> and the DNS name of the service for the pod is <service DNS>

# ---------------- frontend ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: SERVICE_DNS
              value: frontend.shop.svc.cluster.local
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "You successfully hit ${POD_NAME} under ${POD_NAMESPACE} and the DNS name of the service for the pod is ${SERVICE_DNS}" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shop
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---

apiVersion: v1
kind: Namespace
metadata:
  name: ns-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: ns-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-1
  template:
    metadata:
      labels:
        app: nginx-1
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_DNS
              value: nginx.ns-1.svc.cluster.local
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "You successfully hit ${POD_NAME} under ${POD_NAMESPACE} and the DNS name of the service for the pod is ${SERVICE_DNS}" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: ns-1
spec:
  selector:
    app: nginx-1
  ports:
    - port: 80
      targetPort: 80

# =============================================================================
# hostPath demo pod (first writer)
# =============================================================================
# hostPath = mounts a SPECIFIC directory from the NODE's filesystem into the pod.
# Key facts we'll prove:
#   - It is tied to the NODE, not the pod: delete the pod, recreate it, the data
#     is STILL there (as long as it lands on the same node).
#   - It is SHARED: any other pod mounting the same host path sees the same data.
#   - "outside" is a real path you choose (/mnt/data/hostpath-demo on the node).
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-pod
  namespace: vol-demo
  labels:
    demo: hostpath
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo hostpath-pod up on $NODE_NAME; sleep 3600"]
      env:
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
      volumeMounts:
        - name: nodedir
          mountPath: /data
  volumes:
    - name: nodedir
      hostPath:
        path: /mnt/data/hostpath-demo    # a real directory ON THE NODE
        type: DirectoryOrCreate

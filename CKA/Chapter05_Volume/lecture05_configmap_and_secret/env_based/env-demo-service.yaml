apiVersion: v1
kind: Service
metadata:
  name: env-demo-svc
  labels:
    app: env-demo
spec:
  type: NodePort
  selector:
    app: env-demo        # must match the Pod labels in the ReplicaSet
  ports:
  - port: 80             # Service port (inside the cluster)
    targetPort: 80       # Container port (nginx)
    nodePort: 30080      # External port on the node (range 30000-32767)

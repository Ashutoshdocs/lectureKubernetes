# =============================================================================
# 20 - NFS server (provides the "outside" for the NFS proof)
# =============================================================================
# A tiny in-cluster NFS server. Its export is the shared filesystem behind
# PVC #2. "Outside the pod" here = exec into this server pod and look at /exports
# - or write there and watch it appear inside the consumer pod.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  namespace: pv-types
  labels: { app: nfs-server }
spec:
  replicas: 1
  selector: { matchLabels: { app: nfs-server } }
  template:
    metadata: { labels: { app: nfs-server } }
    spec:
      containers:
        - name: nfs-server
          image: itsthenetwork/nfs-server-alpine:12
          securityContext: { privileged: true }
          env:
            - name: SHARED_DIRECTORY
              value: /exports
          ports:
            - { name: nfs, containerPort: 2049 }
            - { name: mountd, containerPort: 20048 }
            - { name: rpcbind, containerPort: 111 }
          volumeMounts:
            - { name: export-vol, mountPath: /exports }
      volumes:
        - name: export-vol
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: pv-types
  labels: { app: nfs-server }
spec:
  selector: { app: nfs-server }
  ports:
    - { name: nfs, port: 2049, targetPort: 2049 }
    - { name: mountd, port: 20048, targetPort: 20048 }
    - { name: rpcbind, port: 111, targetPort: 111 }

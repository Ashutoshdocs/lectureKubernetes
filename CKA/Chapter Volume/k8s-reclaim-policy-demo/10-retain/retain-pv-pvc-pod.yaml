# =============================================================================
# 10 - RECLAIM POLICY: Retain
# =============================================================================
# CLAIM TO PROVE:
#   With persistentVolumeReclaimPolicy: Retain, deleting the PVC does NOT delete
#   the PV or its data. The PV moves to phase "Released" and stays there,
#   holding the data, until an admin cleans it up manually. This is the safe
#   default for anything you can't afford to lose.
#
# Backing store: a hostPath on the node. hostPath survives PV deletion, which
# lets us literally prove the data is still on disk after everything is gone.
# (hostPath is used here ONLY because it makes the proof visible on any cluster;
#  in production Retain is used with EBS/PD/NFS/Ceph etc.)
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: reclaim-demo
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: retain-pv
  labels:
    demo: retain
spec:
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain      # <-- THE POLICY UNDER TEST
  storageClassName: manual-retain
  hostPath:
    path: /mnt/data/retain-pv                 # created on the node
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retain-pvc
  namespace: reclaim-demo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual-retain
  resources:
    requests:
      storage: 100Mi
  selector:
    matchLabels:
      demo: retain
---
apiVersion: v1
kind: Pod
metadata:
  name: retain-writer
  namespace: reclaim-demo
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          echo "important data written at $(date -u)" > /data/precious.txt
          echo "wrote /data/precious.txt:"; cat /data/precious.txt
          sleep 3600
      volumeMounts:
        - name: vol
          mountPath: /data
  volumes:
    - name: vol
      persistentVolumeClaim:
        claimName: retain-pvc

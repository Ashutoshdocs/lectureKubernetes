# =============================================================================
# 10 - RWX writers: 3 pods, all mounting the SAME PVC read-write at once.
# =============================================================================
# podAntiAffinity tries to spread the 3 replicas across DIFFERENT nodes so the
# demo shows *multi-node* write access (the whole point of RWX). On a 1-node
# cluster (kind/minikube) it still works - they just share the node - and the
# concurrent-writers proof is identical.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rwx-writers
  namespace: pv-demo
  labels:
    app: rwx-writers
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rwx-writers
  template:
    metadata:
      labels:
        app: rwx-writers
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: rwx-writers
                topologyKey: kubernetes.io/hostname
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "[$(hostname)] starting, node=$NODE_NAME"
              while true; do
                echo "$(date -u +%H:%M:%S) hello from pod=$(hostname) node=$NODE_NAME" >> /data/shared.log
                sleep 3
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: shared
              mountPath: /data
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: rwx-nfs-pvc     # SAME claim, mounted RW by all 3 pods

apiVersion: apps/v1
kind: ReplicaSet

metadata:
  name: load-generator

spec:
  replicas: 1

  selector:
    matchLabels:
      app: load-generator

  template:
    metadata:
      labels:
        app: load-generator
        app.kubernetes.io/part-of: hpa-demo

    spec:
      restartPolicy: Always

      containers:
        - name: load-generator
          image: busybox:1.36

          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi

          command:
            - /bin/sh
            - -c

          args:
            - |
              echo "Hammering http://nginx-hpa-svc ..."
              while true; do
                wget -q -O- http://nginx-hpa-svc > /dev/null
              done
#kubectl scale rs load-generator --replicas=5
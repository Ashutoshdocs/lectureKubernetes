apiVersion: v1
kind: Service
metadata:
  name: nginx-hpa-svc
  labels:
    app: nginx-hpa
    app.kubernetes.io/part-of: hpa-demo
spec:
  # ClusterIP is enough — the load generator runs inside the cluster and reaches
  # this Service by its DNS name (http://nginx-hpa-svc).
  type: ClusterIP

  selector:
    app: nginx-hpa

  ports:
    - name: http
      port: 80
      targetPort: http   # matches the named container port in deployment.yaml
      protocol: TCP

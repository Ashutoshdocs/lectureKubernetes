apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-one
  labels:
    app: app-one
spec:
  replicas: 5
  selector:
    matchLabels:
      app: app-one
  template:
    metadata:
      labels:
        app: app-one
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80


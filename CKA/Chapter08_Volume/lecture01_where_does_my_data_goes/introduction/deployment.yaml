apiVersion: apps/v1
kind: Deployment
metadata:
  name: volume-demo
  labels:
    app: volume-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volume-demo
  template:
    metadata:
      labels:
        app: volume-demo
    spec:
      # A single Kubernetes volume. Because it is declared at the POD level and
      # mounted into BOTH containers, its contents are shared between them.
      volumes:
        - name: shared-data
          emptyDir: {}
      containers:
        # ----- Container A -----
        - name: writer
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            # /shared  -> backed by the pod-level emptyDir  => SHARED across containers
            - name: shared-data
              mountPath: /shared
          # NOTE: /private is intentionally NOT a volume mount. Anything written
          # there lives only in THIS container's own writable layer (its
          # container filesystem) and is invisible to the other container.

        # ----- Container B -----
        - name: reader
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            # Same emptyDir mounted here too => it sees the writer's /shared files
            - name: shared-data
              mountPath: /shared
          # /private here is again this container's own private layer.

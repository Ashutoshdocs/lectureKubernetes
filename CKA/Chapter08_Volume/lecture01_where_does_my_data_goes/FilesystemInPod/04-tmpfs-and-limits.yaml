# Lab 5a: /tmp as tmpfs (emptyDir medium: Memory).
# Data written to /tmp is charged to the container's MEMORY limit (128Mi).
apiVersion: v1
kind: Pod
metadata:
  name: tmpfs-demo
  labels:
    lab: storage
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "trap 'exit 0' TERM; while true; do sleep 1; done"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
  volumes:
    - name: tmp
      emptyDir:
        medium: Memory
        sizeLimit: 100Mi
---
# Lab 5b: ephemeral-storage limit on the overlay writable layer.
# Writing more than 100Mi to the rootfs (or /scratch) gets the pod evicted.
apiVersion: v1
kind: Pod
metadata:
  name: eviction-demo
  labels:
    lab: storage
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "trap 'exit 0' TERM; while true; do sleep 1; done"]
      volumeMounts:
        - name: scratch
          mountPath: /scratch
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
          ephemeral-storage: 50Mi
        limits:
          memory: 64Mi
          ephemeral-storage: 100Mi
  volumes:
    - name: scratch
      emptyDir: {}

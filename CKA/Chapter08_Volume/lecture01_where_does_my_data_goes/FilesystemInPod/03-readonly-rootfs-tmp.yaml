# Lab 4: read-only root filesystem with targeted writable emptyDirs.
# The overlay rootfs is mounted "ro"; only /tmp and /var/cache/app accept writes.
apiVersion: v1
kind: Pod
metadata:
  name: readonly-demo
  labels:
    lab: storage
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "trap 'exit 0' TERM; while true; do sleep 1; done"]
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/app
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
          ephemeral-storage: 50Mi
        limits:
          memory: 64Mi
          ephemeral-storage: 200Mi
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 100Mi
    - name: cache
      emptyDir:
        sizeLimit: 50Mi

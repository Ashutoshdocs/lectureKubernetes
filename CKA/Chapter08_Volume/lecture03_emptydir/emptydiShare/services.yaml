# NodePort service for container 1 (nginx-one, port 80)
apiVersion: v1
kind: Service
metadata:
  name: nginx-one-svc
spec:
  type: NodePort
  selector:
    app: two-nginx
  ports:
    - name: http-one
      port: 80
      targetPort: 80
      nodePort: 30081
---
# NodePort service for container 2 (nginx-two, port 8080)
apiVersion: v1
kind: Service
metadata:
  name: nginx-two-svc
spec:
  type: NodePort
  selector:
    app: two-nginx
  ports:
    - name: http-two
      port: 8080
      targetPort: 8080
      nodePort: 30082

# =============================================================================
# emptyDir demo pod
# =============================================================================
# emptyDir = scratch space created EMPTY when the pod is assigned to a node, and
# DELETED FOREVER when the pod is removed from the node. Key facts we'll prove:
#   - It is tied to the POD lifecycle: delete the pod -> data is gone.
#   - It is PRIVATE to the pod: another pod cannot see it (no way to reference).
#   - It lives in a kubelet-managed dir on the node, not a path you choose.
#
# Note: a container CRASH/restart keeps emptyDir (same pod). Deleting the POD is
# what wipes it. This demo deletes the pod to show the data loss.
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-pod
  namespace: vol-demo
  labels:
    demo: emptydir
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo emptydir-pod up on $NODE_NAME; sleep 3600"]
      env:
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
      volumeMounts:
        - name: scratch
          mountPath: /data
  volumes:
    - name: scratch
      emptyDir: {}          # <-- ephemeral, pod-scoped scratch volume

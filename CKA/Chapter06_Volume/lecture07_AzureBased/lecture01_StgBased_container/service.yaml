apiVersion: v1
kind: Service
metadata:
  name: nginx-blob-svc
  labels:
    app: nginx-blob
spec:
  type: NodePort
  selector:
    app: nginx-blob        # matches the Deployment's pod label
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080        # external node port (range 30000-32767)

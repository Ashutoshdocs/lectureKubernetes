# Lab 1 & 2: inspect the overlay rootfs, copy-up and whiteouts.
# The emptyDir at /scratch is included so students can compare a volume mount
# with the overlay "/" in `mount` / `mountinfo` output.
apiVersion: v1
kind: Pod
metadata:
  name: overlay-demo
  labels:
    lab: storage
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "trap 'exit 0' TERM; while true; do sleep 1; done"]
      volumeMounts:
        - name: scratch
          mountPath: /scratch
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
  volumes:
    - name: scratch
      emptyDir: {}

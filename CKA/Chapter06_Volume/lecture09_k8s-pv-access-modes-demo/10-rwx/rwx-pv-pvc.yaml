
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rwx-nfs-pv
  labels:
    demo: rwx
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: nfs-server.pv-demo.svc.cluster.local
    path: /exports
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rwx-nfs-pvc
  namespace: pv-demo
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi
  selector:
    matchLabels:
      demo: rwx

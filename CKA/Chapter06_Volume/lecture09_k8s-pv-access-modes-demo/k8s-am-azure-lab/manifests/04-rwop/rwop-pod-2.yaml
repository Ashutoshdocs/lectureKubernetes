# Second pod on the SAME node (k8s-worker-1) -> Pending (RWO would allow this!)
apiVersion: v1
kind: Pod
metadata:
  name: rwop-pod-2
  namespace: access-modes
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker-1
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"$(date +%T) rwop-pod-2 on k8s-worker-1 owns the volume\" >> /data/owner.log; sleep 5; done"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: rwop-pvc

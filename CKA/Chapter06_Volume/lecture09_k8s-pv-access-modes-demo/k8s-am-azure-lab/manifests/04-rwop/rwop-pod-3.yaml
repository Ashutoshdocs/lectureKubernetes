# Third pod on the OTHER node (k8s-worker-2) -> Pending
apiVersion: v1
kind: Pod
metadata:
  name: rwop-pod-3
  namespace: access-modes
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker-2
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"$(date +%T) rwop-pod-3 on k8s-worker-2 owns the volume\" >> /data/owner.log; sleep 5; done"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: rwop-pvc

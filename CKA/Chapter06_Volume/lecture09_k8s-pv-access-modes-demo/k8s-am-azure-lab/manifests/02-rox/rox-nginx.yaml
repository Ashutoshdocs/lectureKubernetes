# 4 nginx pods spread over both workers, all serving the same read-only content
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rox-web
  namespace: access-modes
spec:
  replicas: 4
  selector:
    matchLabels:
      app: rox-web
  template:
    metadata:
      labels:
        app: rox-web
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor        # ignore the tainted control-plane node when counting
          labelSelector:
            matchLabels:
              app: rox-web
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
      volumes:
        - name: site
          persistentVolumeClaim:
            claimName: rox-pvc
            readOnly: true        # <- THIS makes the mount read-only
---
apiVersion: v1
kind: Service
metadata:
  name: rox-web
  namespace: access-modes
spec:
  selector:
    app: rox-web
  ports:
    - port: 80
      targetPort: 80

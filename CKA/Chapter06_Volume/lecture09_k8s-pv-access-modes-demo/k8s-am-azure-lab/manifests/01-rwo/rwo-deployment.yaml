# 3 replicas sharing ONE RWO volume -> all must run on the SAME node
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rwo-writer
  namespace: access-modes
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rwo-writer
  template:
    metadata:
      labels:
        app: rwo-writer
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date +%T) pod=$HOSTNAME node=$NODE_NAME" >> /data/log.txt
                sleep 5
              done
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rwo-local-pvc

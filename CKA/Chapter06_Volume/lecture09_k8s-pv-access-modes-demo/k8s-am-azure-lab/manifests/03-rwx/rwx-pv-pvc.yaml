---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rwx-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-static
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 10.0.1.4
    path: /srv/nfs/k8s/rwx
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rwx-pvc
  namespace: access-modes
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-static
  volumeName: rwx-pv
  resources:
    requests:
      storage: 1Gi

# Same ROX claim, but the pod FORGETS readOnly: true
apiVersion: v1
kind: Pod
metadata:
  name: rox-careless
  namespace: access-modes
spec:
  containers:
    - name: oops
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: site
          mountPath: /site
  volumes:
    - name: site
      persistentVolumeClaim:
        claimName: rox-pvc        # no readOnly: true !

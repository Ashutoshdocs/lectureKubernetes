# 4 writers on 2 nodes, all appending to the SAME file
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rwx-writer
  namespace: access-modes
spec:
  replicas: 4
  selector:
    matchLabels:
      app: rwx-writer
  template:
    metadata:
      labels:
        app: rwx-writer
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor        # ignore the tainted control-plane node when counting
          labelSelector:
            matchLabels:
              app: rwx-writer
      containers:
        - name: writer
          image: busybox:1.36
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date +%T) pod=$HOSTNAME node=$NODE_NAME" >> /shared/events.log
                sleep 3
              done
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: rwx-pvc

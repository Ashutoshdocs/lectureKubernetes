# DEMO 2b — nginx on BOTH workers serving the same read-only content
# ------------------------------------------------------------------
# Note `readOnly: true` on the pod volume — THIS is what makes the mount ro.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rox-web
  namespace: am-demo
spec:
  replicas: 4
  selector:
    matchLabels: { app: rox-web }
  template:
    metadata:
      labels: { app: rox-web }
    spec:
      topologySpreadConstraints:          # spread evenly across workers
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: rox-web }
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
      volumes:
        - name: site
          persistentVolumeClaim:
            claimName: rox-website-pvc
            readOnly: true                # <-- enforcement lives here (or on the PV)
---
apiVersion: v1
kind: Service
metadata:
  name: rox-web
  namespace: am-demo
spec:
  selector: { app: rox-web }
  ports: [{ port: 80, targetPort: 80 }]

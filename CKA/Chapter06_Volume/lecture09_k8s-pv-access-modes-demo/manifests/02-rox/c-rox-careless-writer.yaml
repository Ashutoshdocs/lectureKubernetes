# DEMO 2c — THE GOTCHA: ROX on the claim does NOT make the mount read-only
# ------------------------------------------------------------------------
# Same ROX PVC, but this pod forgets `readOnly: true`.
# Expectation: the write SUCCEEDS (because the NFS export itself is rw).
apiVersion: v1
kind: Pod
metadata:
  name: rox-careless-writer
  namespace: am-demo
spec:
  containers:
    - name: oops
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - { name: site, mountPath: /site }
  volumes:
    - name: site
      persistentVolumeClaim:
        claimName: rox-website-pvc        # no readOnly: true !

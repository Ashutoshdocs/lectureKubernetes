# DEMO 4a — ReadWriteOncePod: exactly ONE pod in the whole cluster
# ----------------------------------------------------------------
# RWOP is CSI-only (stable since Kubernetes 1.29). nfs-csi is a CSI driver,
# so it works here. Enforcement is done by kube-scheduler (+ kubelet), so it
# holds even though NFS could happily be mounted everywhere.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rwop-pvc
  namespace: am-demo
spec:
  accessModes: [ReadWriteOncePod]       # must be the ONLY access mode
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: rwop-writer-1
  namespace: am-demo
  labels: { app: rwop }
spec:
  containers:
    - name: writer
      image: busybox:1.36
      env:
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            echo "$(date +%T) $HOSTNAME on $NODE_NAME owns the volume" >> /data/owner.log
            sleep 5
          done
      volumeMounts:
        - { name: data, mountPath: /data }
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: rwop-pvc

# DEMO 1c — THE GOTCHA: RWO on NFS is NOT enforced across nodes
# ---------------------------------------------------------------
# NFS volumes have no "attach" step and no node affinity, so nothing stops two
# nodes from mounting an RWO NFS volume. Access modes are mainly a *matching
# contract* between PVC and PV; enforcement depends on the backend.
#
# Expectation: BOTH pods Running, on DIFFERENT workers, writing to one file.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rwo-nfs-pvc
  namespace: am-demo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rwo-nfs-writer
  namespace: am-demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: rwo-nfs-writer }
  template:
    metadata:
      labels: { app: rwo-nfs-writer }
    spec:
      affinity:
        podAntiAffinity:            # force one replica per worker
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app: rwo-nfs-writer }
      containers:
        - name: writer
          image: busybox:1.36
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date +%T) node=$NODE_NAME" >> /data/log.txt
                sleep 5
              done
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rwo-nfs-pvc

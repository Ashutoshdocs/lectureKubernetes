# DEMO 1a — ReadWriteOnce on a node-local disk (local-path)
# ---------------------------------------------------------
# local-path creates a directory on ONE worker's disk and stamps the PV with
# nodeAffinity for that worker. That is what "RWO = one node" looks like for
# real block/local storage (EBS, GCE PD, Azure Disk behave the same way, with
# a Multi-Attach error instead of a node-affinity conflict).
#
# Expectation: all 3 replicas land on the SAME node and share the volume.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rwo-local-pvc
  namespace: am-demo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path        # WaitForFirstConsumer: node chosen when 1st pod schedules
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rwo-writer
  namespace: am-demo
spec:
  replicas: 3
  selector:
    matchLabels: { app: rwo-writer }
  template:
    metadata:
      labels: { app: rwo-writer }
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date +%T) pod=$HOSTNAME node=$NODE_NAME" >> /data/log.txt
                sleep 5
              done
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rwo-local-pvc

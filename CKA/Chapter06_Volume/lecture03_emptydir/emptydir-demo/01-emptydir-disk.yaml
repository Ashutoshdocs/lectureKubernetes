# emptyDir backed by the NODE'S DISK (the default)
# Data lives under /var/lib/kubelet/pods/<pod-uid>/volumes/kubernetes.io~empty-dir/
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-disk
  labels:
    demo: emptydir
spec:
  containers:
    - name: bench
      image: alpine:3.20
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          memory: "128Mi"
          cpu: "250m"
        limits:
          memory: "512Mi"
          cpu: "1"
      volumeMounts:
        - name: scratch
          mountPath: /scratch
  volumes:
    - name: scratch
      emptyDir:
        sizeLimit: 1Gi        # counts against node ephemeral-storage

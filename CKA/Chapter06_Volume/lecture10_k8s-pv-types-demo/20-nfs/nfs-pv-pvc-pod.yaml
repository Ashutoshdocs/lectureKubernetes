# =============================================================================
# 20 - NFS PV/PVC + pod-c   (PVC #2 of 2, the 3rd pod)
# =============================================================================
# pod-c is the 3rd pod in the demo and mounts a DIFFERENT PVC (nfs-pvc) than
# pod-a/pod-b. This completes the "3 pods, 2 PVCs" layout:
#     PVC #1 hostpath-pvc  <- pod-a, pod-b
#     PVC #2 nfs-pvc       <- pod-c
#
# NFS is ReadWriteMany so it could be shared too, but here we use it to prove
# the inside/outside reflection against the NFS server export.
# =============================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pv
  labels:
    type: nfs
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-nfs
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: nfs-server.pv-types.svc.cluster.local
    path: /
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-pvc
  namespace: pv-types
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: manual-nfs
  resources:
    requests:
      storage: 1Gi
  selector:
    matchLabels:
      type: nfs
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-c
  namespace: pv-types
  labels:
    app: nfs-consumer
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo pod-c up on $NODE_NAME; sleep 3600"]
      env:
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
      volumeMounts:
        - name: nfsvol
          mountPath: /data
  volumes:
    - name: nfsvol
      persistentVolumeClaim:
        claimName: nfs-pvc

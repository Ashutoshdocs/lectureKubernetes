# =============================================================================
# writer - production-hardened. Appends timestamped lines (with its own pod name)
# to /shared/data.txt on the RWX volume. 2 replicas prove many writers can share
# the volume concurrently (RWX). Compare to the original bare writer-pod.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  namespace: shared-storage
  labels:
    app.kubernetes.io/name: writer
    app.kubernetes.io/component: producer
    app.kubernetes.io/part-of: shared-storage-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: writer
        app.kubernetes.io/component: producer
    spec:
      # ---- pod-level security: satisfies the "restricted" PSA profile ----
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000                 # makes the NFS mount group-writable for uid 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "writer $(hostname) starting on node $NODE_NAME"
              while true; do
                echo "$(date -u +%FT%TZ) written by $(hostname)" >> /shared/data.txt
                sleep 5
              done
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          # ---- container-level hardening ----
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
          livenessProbe:                # alive only if the volume is writable
            exec: { command: ["sh", "-c", "test -w /shared"] }
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: shared-pvc       # RWX claim, mounted read-write here

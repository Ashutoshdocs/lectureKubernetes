# =============================================================================
# reader - production-hardened. Mounts the SAME RWX volume but READ-ONLY, and
# tails /shared/data.txt. The readOnly mount means even a compromised reader
# cannot corrupt the shared data - a real production concern the original demo
# (both pods read-write) ignored.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reader
  namespace: shared-storage
  labels:
    app.kubernetes.io/name: reader
    app.kubernetes.io/component: consumer
    app.kubernetes.io/part-of: shared-storage-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: reader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reader
        app.kubernetes.io/component: consumer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reader
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "reader $(hostname) tailing shared data (read-only)"
              # wait until the writer has created the file
              while [ ! -f /shared/data.txt ]; do echo "waiting for data..."; sleep 2; done
              tail -f /shared/data.txt
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
          readinessProbe:               # ready only once the shared file is readable
            exec: { command: ["sh", "-c", "test -r /shared/data.txt"] }
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: shared
              mountPath: /shared
              readOnly: true            # <-- consumer cannot write. Key hardening.
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: shared-pvc
            readOnly: true              # belt-and-suspenders: whole volume RO for this pod

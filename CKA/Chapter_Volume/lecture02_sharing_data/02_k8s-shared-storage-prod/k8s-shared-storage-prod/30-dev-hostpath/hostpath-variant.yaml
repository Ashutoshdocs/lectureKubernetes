# =============================================================================
# DEV / LEARNING ONLY - the original writer+reader on hostPath, corrected.
# =============================================================================
# ⚠️  DO NOT USE hostPath for shared app data in production:
#   - node-local: both pods must run on the SAME node; if one is rescheduled
#     elsewhere it sees a DIFFERENT (or empty) directory.
#   - no isolation: the pod can read/write the node's filesystem -> a standard
#     security finding (breaks the "restricted" Pod Security profile).
#   - no capacity/QoS controls, no portability across nodes or clusters.
# Use the RWX PVC in 10-storage/ instead. This file exists only to run the exact
# original demo on a single-node cluster and to show the `type` field correctly.
#
# Fixes vs the original:
#   - type: DirectoryOrCreate (original reader used no type; writer/notes used
#     Directory which FAILS if /data/shared doesn't exist yet).
#   - podAffinity pins reader+writer to the same node (hostPath requires it).
#   - reader mounts read-only.
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: writer-pod
  namespace: shared-storage
  labels: { demo: hostpath-dev, role: writer }
spec:
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector: { matchLabels: { demo: hostpath-dev } }
            topologyKey: kubernetes.io/hostname
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /shared/data.txt; sleep 5; done"]
      volumeMounts:
        - { name: shared-storage, mountPath: /shared }
  volumes:
    - name: shared-storage
      hostPath:
        path: /data/shared
        type: DirectoryOrCreate      # create the dir if missing (safe default)
---
apiVersion: v1
kind: Pod
metadata:
  name: reader-pod
  namespace: shared-storage
  labels: { demo: hostpath-dev, role: reader }
spec:
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector: { matchLabels: { demo: hostpath-dev } }
            topologyKey: kubernetes.io/hostname
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "while true; do cat /shared/data.txt; echo ------; sleep 10; done"]
      volumeMounts:
        - { name: shared-storage, mountPath: /shared, readOnly: true }
  volumes:
    - name: shared-storage
      hostPath:
        path: /data/shared
        type: DirectoryOrCreate

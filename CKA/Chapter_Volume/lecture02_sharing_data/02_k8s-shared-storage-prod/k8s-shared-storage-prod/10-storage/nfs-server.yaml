# =============================================================================
# In-cluster NFS server = a self-contained RWX backend so this demo runs
# anywhere. In REAL production you delete this file and point the PVC at a
# managed RWX StorageClass instead (see storageclass-swap.md).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  namespace: shared-storage
  labels: { app.kubernetes.io/name: nfs-server }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: nfs-server } }
  template:
    metadata: { labels: { app.kubernetes.io/name: nfs-server } }
    spec:
      # NFS kernel server needs privileges - this pod is intentionally NOT under
      # the restricted profile; keep it out of app namespaces in real clusters.
      containers:
        - name: nfs-server
          image: itsthenetwork/nfs-server-alpine:12
          securityContext:
            privileged: true
          env:
            - { name: SHARED_DIRECTORY, value: /exports }
          ports:
            - { name: nfs, containerPort: 2049 }
            - { name: mountd, containerPort: 20048 }
            - { name: rpcbind, containerPort: 111 }
          volumeMounts:
            - { name: export-vol, mountPath: /exports }
      volumes:
        - name: export-vol
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: shared-storage
  labels: { app.kubernetes.io/name: nfs-server }
spec:
  selector: { app.kubernetes.io/name: nfs-server }
  ports:
    - { name: nfs, port: 2049, targetPort: 2049 }
    - { name: mountd, port: 20048, targetPort: 20048 }
    - { name: rpcbind, port: 111, targetPort: 111 }

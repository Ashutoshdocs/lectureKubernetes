# =============================================================================
# 30 - RWO  -- EXPERIMENT A: two pods, SAME node, both mount the RWO PVC.
# =============================================================================
# EXPECTED RESULT: BOTH pods run fine and share the volume.
# This DISPROVES the myth "RWO = only one pod". The limit is one NODE, not one
# pod. We pin both pods to the same node with podAffinity so they co-locate.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rwo-same-node
  namespace: pv-demo
  labels:
    app: rwo-same-node
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rwo-same-node
  template:
    metadata:
      labels:
        app: rwo-same-node
    spec:
      # Force both replicas onto the SAME node.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: rwo-same-node
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "$(date -u +%H:%M:%S) $(hostname) on node=$NODE_NAME writing" >> /data/rwo.log
              tail -f /data/rwo.log
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: vol
              mountPath: /data
      volumes:
        - name: vol
          persistentVolumeClaim:
            claimName: rwo-pvc

# DEMO 7 - CORDON / DRAIN with a PodDisruptionBudget
# 6 replicas spread over all workers. PDB says at least 4 must stay available,
# so "kubectl drain" evicts pods gradually and never takes the app below 4.
# Also includes a bare Pod (no controller) to show why drain needs --force.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drain-app
  namespace: scheduling-demo
  labels:
    demo: drain
spec:
  replicas: 6
  selector:
    matchLabels:
      app: drain-app
  template:
    metadata:
      labels:
        app: drain-app
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: drain-app
      terminationGracePeriodSeconds: 10
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
          volumeMounts:
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: scratch
          emptyDir: {}            # emptyDir -> drain needs --delete-emptydir-data
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: drain-app-pdb
  namespace: scheduling-demo
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app: drain-app
---
# Bare pod pinned to worker-a2: NOT managed by a controller -> drain refuses without --force,
# and with --force it is deleted and NEVER recreated.
apiVersion: v1
kind: Pod
metadata:
  name: orphan-pod
  namespace: scheduling-demo
  labels:
    demo: drain
spec:
  nodeName: worker-a2
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "sleep 36000"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp

spec:
  replicas: 3

  selector:
    matchLabels:
      app: webapp

  template:
    metadata:
      labels:
        app: webapp

    spec:
      containers:

      - name: app

        image: python:3.12-slim

        command:
        - sh
        - -c
        - |
          pip install flask
          python /app/app.py

        env:

        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name

        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        volumeMounts:
        - name: code
          mountPath: /app

      volumes:
      - name: code
        configMap:
          name: webapp-code

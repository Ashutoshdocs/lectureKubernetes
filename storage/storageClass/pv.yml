apiVersion: v1
kind: PersistentVolume

metadata:
  name: azure-pv

spec:
  capacity:
    storage: 4Gi

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  csi:
    driver: disk.csi.azure.com

    volumeHandle: az disk show -g aks-demo-rg -n demoDisk --query id -o tsv

    fsType: ext4
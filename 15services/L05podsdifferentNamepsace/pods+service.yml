apiVersion: v1
kind: Namespace
metadata:
  name: team1
---
apiVersion: v1
kind: Namespace
metadata:
  name: team2
---
apiVersion: v1
kind: Pod
metadata:
  name: pod1
  namespace: team1
  labels:
    app: pod1
spec:
  containers:
  - name: nginx
    image: nginx:latest
    command:
    - /bin/sh
    - -c
    - |
      echo "<h1>Hit Pod1</h1>" > /usr/share/nginx/html/index.html
      nginx -g 'daemon off;'
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pod1-service
  namespace: team1
spec:
  type: ClusterIP
  selector:
    app: pod1
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: pod2
  namespace: team2
  labels:
    app: pod2
spec:
  containers:
  - name: nginx
    image: nginx:latest
    command:
    - /bin/sh
    - -c
    - |
      echo "<h1>Hit Pod2</h1>" > /usr/share/nginx/html/index.html
      nginx -g 'daemon off;'
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pod2-service
  namespace: team2
spec:
  type: ClusterIP
  selector:
    app: pod2
  ports:
  - port: 80
    targetPort: 80
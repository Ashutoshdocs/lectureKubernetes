apiVersion: apps/v1
kind: Deployment
metadata:
  name: fancy-frontend
  labels:
    app: fancy-frontend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: fancy-frontend

  template:
    metadata:
      labels:
        app: fancy-frontend

    spec:

      containers:
        - name: frontend
          image: nginx:alpine

          ports:
            - containerPort: 80

          volumeMounts:
            - name: website
              mountPath: /usr/share/nginx/html

      volumes:
        - name: website
          configMap:
            name: fancy-frontend-html

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fancy-frontend-html

data:
  index.html: |
    <!DOCTYPE html>

    <html lang="en">

    <head>

      <meta charset="UTF-8">

      <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

      <title>Kubernetes NodePort Demo</title>

      <style>

        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;

          min-height: 100vh;

          font-family:
            Arial,
            Helvetica,
            sans-serif;

          background:
            linear-gradient(
              135deg,
              #0f172a,
              #1e3a8a,
              #0ea5e9
            );

          color: white;

          display: flex;

          align-items: center;

          justify-content: center;

          padding: 30px;
        }

        .container {
          width: 90%;

          max-width: 1050px;

          text-align: center;
        }

        .card {
          background:
            rgba(255,255,255,0.10);

          backdrop-filter:
            blur(15px);

          border:
            1px solid
            rgba(255,255,255,0.20);

          border-radius: 25px;

          padding: 50px;

          box-shadow:
            0 20px 50px
            rgba(0,0,0,0.35);
        }

        .logo {
          width: 90px;

          height: 90px;

          margin:
            0 auto 20px;

          border-radius: 20px;

          display: flex;

          align-items: center;

          justify-content: center;

          background:
            rgba(255,255,255,0.12);

          border:
            1px solid
            rgba(255,255,255,0.20);

          font-size: 24px;

          font-weight: bold;
        }

        h1 {
          font-size: 44px;

          margin: 10px 0;

          background:
            linear-gradient(
              90deg,
              #ffffff,
              #bae6fd
            );

          -webkit-background-clip:
            text;

          -webkit-text-fill-color:
            transparent;
        }

        .subtitle {
          font-size: 20px;

          color: #cbd5e1;

          margin-bottom: 30px;
        }

        .badge {
          display: inline-block;

          padding:
            10px 22px;

          background:
            rgba(34,197,94,0.18);

          border:
            1px solid
            #22c55e;

          color:
            #86efac;

          border-radius: 30px;

          font-weight: bold;

          margin-top: 10px;
        }

        .grid {
          display: grid;

          grid-template-columns:
            repeat(3, 1fr);

          gap: 20px;

          margin-top: 35px;
        }

        .box {
          background:
            rgba(255,255,255,0.10);

          border:
            1px solid
            rgba(255,255,255,0.12);

          border-radius: 18px;

          padding: 30px 20px;

          transition:
            transform 0.2s,
            background 0.2s;
        }

        .box:hover {
          transform:
            translateY(-5px);

          background:
            rgba(255,255,255,0.16);
        }

        .icon {
          width: 55px;

          height: 55px;

          margin:
            0 auto 15px;

          border-radius: 15px;

          display: flex;

          align-items: center;

          justify-content: center;

          background:
            #2563eb;

          font-size: 16px;

          font-weight: bold;
        }

        .box h3 {
          margin:
            10px 0;

          font-size: 20px;
        }

        .box p {
          color:
            #cbd5e1;

          font-size: 16px;

          line-height: 1.5;
        }

        .flow {
          margin-top: 40px;

          padding: 20px;

          background:
            rgba(0,0,0,0.15);

          border-radius: 15px;

          font-size: 17px;

          font-weight: bold;

          color: #e2e8f0;
        }

        .arrow {
          margin:
            0 12px;

          color:
            #38bdf8;
        }

        footer {
          margin-top: 30px;

          color:
            #94a3b8;

          font-size: 14px;
        }

        @media(max-width:700px) {

          .grid {
            grid-template-columns:
              1fr;
          }

          h1 {
            font-size: 32px;
          }

          .card {
            padding:
              30px 20px;
          }

          .flow {
            font-size: 14px;
          }

        }

      </style>

    </head>

    <body>

      <div class="container">

        <div class="card">

          <div class="logo">
            K8S
          </div>

          <h1>
            Kubernetes NodePort
          </h1>

          <div class="subtitle">
            External traffic successfully
            reached the Kubernetes cluster
          </div>

          <span class="badge">
            APPLICATION RUNNING
          </span>

          <div class="grid">

            <div class="box">

              <div class="icon">
                DEP
              </div>

              <h3>
                Deployment
              </h3>

              <p>
                3 Frontend Pods
              </p>

            </div>

            <div class="box">

              <div class="icon">
                SVC
              </div>

              <h3>
                Service
              </h3>

              <p>
                NodePort
              </p>

            </div>

            <div class="box">

              <div class="icon">
                NET
              </div>

              <h3>
                Access
              </h3>

              <p>
                Node IP + Port 30080
              </p>

            </div>

          </div>

          <div class="flow">

            Browser

            <span class="arrow">
              -->
            </span>

            NodePort

            <span class="arrow">
              -->
            </span>

            Service

            <span class="arrow">
              -->
            </span>

            Pod

          </div>

          <footer>

            Kubernetes Networking Demo
            | NodePort Service
            | Port 30080

          </footer>

        </div>

      </div>

    </body>

    </html>
---
apiVersion: v1
kind: Service

metadata:
  name: fancy-frontend-nodeport
  labels:
    app: fancy-frontend

spec:
  type: NodePort

  selector:
    app: fancy-frontend

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
apiVersion: keda.sh/v1alpha1
kind: ScaledObject

metadata:
  name: worker-scaler
  namespace: default

spec:

  scaleTargetRef:
    name: worker

  minReplicaCount: 0
  maxReplicaCount: 10

  pollingInterval: 5
  cooldownPeriod: 30

  triggers:

    - type: redis

      metadata:

        address: redis.default.svc.cluster.local:6379

        listName: tasks

        listLength: "5"

        databaseIndex: "0"
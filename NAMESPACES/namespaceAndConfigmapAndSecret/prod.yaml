apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: prod
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: prodpassword

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: prod
data:
  MYSQL_DATABASE: proddb

---
apiVersion: v1
kind: Pod
metadata:
  name: mysql-prod
  namespace: prod
  labels:
    app: mysql
spec:
  containers:
  - name: mysql
    image: mysql:8.0

    env:
    - name: MYSQL_ROOT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: mysql-secret
          key: MYSQL_ROOT_PASSWORD

    - name: MYSQL_DATABASE
      valueFrom:
        configMapKeyRef:
          name: mysql-config
          key: MYSQL_DATABASE

    ports:
    - containerPort: 3306
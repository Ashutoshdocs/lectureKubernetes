# =============================================================================
# DEV Secret
# -----------------------------------------------------------------------------
# A Secret is just like a ConfigMap but intended for sensitive values. Two ways
# to write the data:
#   stringData: -> you type the plain value; Kubernetes base64-encodes it for you
#                  (write-only convenience; it shows up under data: afterwards).
#   data:       -> you supply the value ALREADY base64-encoded.
#
# CRITICAL TRUTH: base64 is ENCODING, not encryption. Anyone who can read this
# Secret (or the etcd store) can trivially decode it. A Secret is only as safe as
# your RBAC and your "encryption at rest" configuration. See the README security
# section - this plaintext password is for the lab ONLY.
#
#   kubectl apply -f 02-secret-dev.yaml
#   kubectl get secret mysql-secret -n dev -o yaml     # values are base64
#   kubectl get secret mysql-secret -n dev \
#     -o jsonpath='{.data.MYSQL_ROOT_PASSWORD}' | base64 -d   # ...trivially decoded
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: dev
type: Opaque                # generic key/value secret (the default kind)
stringData:                 # keys are valid env-var names -> usable via env/secretKeyRef
  MYSQL_ROOT_PASSWORD: devpassword
  MYSQL_PASSWORD: devuserpass
